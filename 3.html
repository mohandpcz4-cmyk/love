<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ For You</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
:root {
  --cream: #1a060b;
  --pink: #b5425a;
  --rose: #ba4965;
  --text: #faeff1;
  --soft: #d2a1ab;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Cairo', sans-serif;
  background: var(--cream);
  color: var(--text);
  min-height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Background */
.bg-canvas {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(72px);
  opacity: .45;
  animation: blobFloat 18s infinite alternate ease-in-out;
}

.blob-1 {
  width: 520px;
  height: 520px;
  background: #8a253b;
  top: -120px;
  left: -80px;
}

.blob-2 {
  width: 440px;
  height: 440px;
  background: #8a253b;
  bottom: 0;
  right: -100px;
  animation-duration: 22s;
}

.blob-3 {
  width: 380px;
  height: 380px;
  background: #dec1b2;
  bottom: 10%;
  left: 20%;
  animation-duration: 26s;
}

@keyframes blobFloat {
  0% { transform: translate(0,0) scale(1); }
  50% { transform: translate(30px,-35px) scale(1.1); }
  100% { transform: translate(-20px,30px) scale(.95); }
}

/* Main */
.container {
  width: 100%;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  position: relative;
  z-index: 2;
}

.content {
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 25px;
}

/* Google button */
.google-logo-wrap {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  background: rgba(61,17,28,.32);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(181,66,90,.25);
  box-shadow: 0 8px 48px rgba(26,6,11,.6);
  transition: .5s;
}

.google-logo-wrap:hover {
  transform: scale(1.06);
}

.pulse-ring {
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 2.5px solid var(--rose);
  animation: pulseRing 1.8s ease-out infinite;
}

@keyframes pulseRing {
  0% { transform: scale(.9); opacity: .7; }
  70% { transform: scale(1.25); opacity: 0; }
  100% { transform: scale(.9); opacity: 0; }
}

.click-tooltip {
  position: absolute;
  top: -46px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(61,17,28,.75);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(181,66,90,.4);
  border-radius: 999px;
  padding: 7px 18px;
  font-size: .9rem;
  font-weight: 700;
  color: var(--soft);
  white-space: nowrap;
  animation: tooltipBob 2s ease-in-out infinite;
}

@keyframes tooltipBob {
  0%,100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(-5px); }
}

.google-g {
  transition: .4s;
}

.google-g.clicked {
  transform: scale(.7);
  opacity: .4;
}

/* Reveal */
.reveal {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 22px;
  width: 100%;
  animation: scaleIn .8s cubic-bezier(.34,1.56,.64,1);
}

.reveal.show {
  display: flex;
}

.reveal-caption {
  font-family: 'Cairo', sans-serif;
  font-size: 1.5rem;
  font-weight: 900;
  color: #faeff1;
  line-height: 1.6;
  text-shadow: 0 2px 15px rgba(181,66,90,.5);
  animation: fadeInUp .8s ease both;
}

.reveal-img-wrap {
  position: relative;
  width: 100%;
  max-width: 350px;
  border-radius: 22px;
  overflow: hidden;
  box-shadow: 0 12px 48px rgba(0,0,0,.5);
  border: 1px solid rgba(181,66,90,.3);
  animation: scaleIn 1s ease both;
}

.reveal-img {
  width: 100%;
  max-height: 55vh;
  display: block;
  object-fit: contain;
}

.img-shimmer {
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg,rgba(255,255,255,.08),transparent 50%);
  pointer-events: none;
}

/* Continue button */
.continue-btn {
  display: none;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 15px 48px;
  border-radius: 999px;
  border: 1px solid rgba(181,66,90,.5);
  background: linear-gradient(135deg,rgba(61,17,28,.9),rgba(181,66,90,.65));
  color: white;
  font-family: inherit;
  font-size: 1.05rem;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 28px rgba(181,66,90,.25);
  transition: .3s;
  opacity: 0;
  transform: translateY(12px);
}

.continue-btn.show {
  display: flex;
  animation: fadeInUp .7s ease forwards;
}

.continue-btn:hover {
  transform: translateY(-3px) scale(1.04);
  box-shadow: 0 8px 36px rgba(181,66,90,.4);
}

.continue-btn:active {
  transform: scale(.96);
}

/* Hearts */
.hearts-container {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 1;
}

.heart-particle {
  position: absolute;
  bottom: -40px;
  animation: heartFloat 3.5s ease-in forwards;
  opacity: .85;
}

@keyframes heartFloat {
  0% { transform: translateY(0) scale(.8); opacity: .9; }
  100% { transform: translateY(-100vh) scale(1.2); opacity: 0; }
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes scaleIn {
  from { opacity: 0; transform: scale(.88); }
  to { opacity: 1; transform: scale(1); }
}

@media(max-width: 380px) {
  .reveal-caption { font-size: 1.25rem; }
  .reveal-img-wrap { max-width: 300px; }
}
</style>
</head>

<body>

<div class="bg-canvas">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<div class="hearts-container" id="hearts"></div>

<main class="container">
  <div class="content">

    <!-- Click Screen -->
    <div class="google-logo-wrap" id="google">
      <div class="pulse-ring"></div>

      <div class="click-tooltip">
        من هي أجمل بنت في العالم؟
      </div>

      <div class="google-g" id="google-g">
        <svg viewBox="0 0 48 48" width="72" height="72">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
      </div>
    </div>

    <!-- Image Reveal -->
    <div class="reveal" id="reveal">

      <p class="reveal-caption">
        أجمل بنت في الكون كله 🥹🌸
      </p>

      <div class="reveal-img-wrap">
        <img
          src="pics/5.jpg"
          alt="أجمل بنت في الكون كله"
          class="reveal-img"
          onerror="this.src='https://placehold.co/400x500/8a253b/ebd5d9?text=💕'"
        >
        <div class="img-shimmer"></div>
      </div>

      <button class="continue-btn" id="continue">
        <span>متابعة</span>
        <span>←</span>
      </button>

    </div>
  </div>
</main>

<script>
const google = document.getElementById('google');
const googleG = document.getElementById('google-g');
const reveal = document.getElementById('reveal');
const continueBtn = document.getElementById('continue');
const hearts = document.getElementById('hearts');

let opened = false;

google.addEventListener('click', () => {
  if (opened) return;
  opened = true;

  googleG.classList.add('clicked');
  google.style.transition = '.5s';
  google.style.transform = 'scale(.6)';
  google.style.opacity = '0';

  setTimeout(() => {
    google.style.display = 'none';
    reveal.classList.add('show');

    setTimeout(() => {
      continueBtn.classList.add('show');
      startHearts();
    }, 1200);

  }, 550);
});

function startHearts() {
  const emojis = ['💕','💖','💗','💓','😍','🎀','💝','❤️','🌷','💞'];

  setInterval(() => {
    const heart = document.createElement('span');
    heart.className = 'heart-particle';
    heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    heart.style.left = Math.random() * 95 + '%';
    heart.style.fontSize = (18 + Math.random() * 15) + 'px';

    hearts.appendChild(heart);

    setTimeout(() => heart.remove(), 4000);
  }, 400);
}

continueBtn.addEventListener('click', () => {
  window.location.href = '4.html';
});
</script>

</body>
</html>
